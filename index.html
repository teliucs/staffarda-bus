<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Staffarda Bus</title>
<link rel="icon" href="logo/icon.png" type="image/png" sizes="512x512">
<link rel="shortcut icon" href="logo/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo/icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg: #0b1220;
    --bg-2: #0f1b33;
    --card: rgba(22, 34, 54, 0.88);
    --card-hover: rgba(27, 43, 68, 0.96);
    --text: #eef4ff;
    --muted: #98a8c3;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 14px 30px rgba(0,0,0,0.28);
    --accent: #5aa9ff;
    --accent-soft: rgba(90,169,255,0.16);
    --live: #d9e8ff;
    --error: #ffb4b4;
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, #17315d 0%, var(--bg) 38%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
    color: var(--text);
  }

  body {
    padding: max(18px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
  }

  .app {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand img {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    flex: 0 0 auto;
  }

  .brand-copy {
    min-width: 0;
  }

  h1 {
    margin: 0;
    font-size: 1.9rem;
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .refresh-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border-radius: 14px;
    min-width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .refresh-btn:active {
    transform: scale(0.98);
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 8px 0 18px;
    color: var(--muted);
    font-size: 0.85rem;
  }



  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .stop {
    width: 100%;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, var(--card), rgba(18,29,47,0.95));
    color: var(--text);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: start;
    text-align: left;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    min-height: auto;
  }

  .stop:hover {
    background: linear-gradient(180deg, var(--card-hover), rgba(21,37,60,0.98));
    border-color: rgba(90,169,255,0.28);
  }

  .stop:active {
    transform: scale(0.988);
  }

  .stop-main {
    min-width: 0;
    padding-top: 2px;
  }

  .stop-name {
    display: block;
    font-size: 1.06rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
    line-height: 1.15;
  }

  .stop-code {
    display: block;
    margin-top: 4px;
    font-size: 0.86rem;
    color: var(--muted);
  }

  .stop-live {
    display: grid;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--live);
  }

  .live-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .live-line {
    min-width: 40px;
    padding: 4px 8px;
    border-radius: 10px;
    background: rgba(90,169,255,0.14);
    border: 1px solid rgba(90,169,255,0.16);
    color: #d7e9ff;
    font-size: 0.72rem;
    font-weight: 800;
    text-align: center;
  }

  .live-times {
    color: var(--live);
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 0.82rem;
  }

  .live-times strong {
    font-size: 0.95rem;
    color: #ffffff;
    font-weight: 800;
  }

  .stop-live.loading,
  .stop-live.empty,
  .stop-live.error {
    display: block;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.05);
    font-size: 0.84rem;
    line-height: 1.35;
  }

  .stop-live.loading { color: var(--muted); }
  .stop-live.empty { color: var(--live); }
  .stop-live.error { color: var(--error); }

  .chevron {
    align-self: center;
    color: #7ea9d8;
    font-size: 1.2rem;
    padding-top: 2px;
  }

  .stop-alert {
    margin-top: 6px;
    padding: 5px 10px;
    border-radius: 10px;
    background: rgba(255,183,77,0.12);
    border: 1px solid rgba(255,183,77,0.2);
    color: #ffd080;
    font-size: 0.76rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .stop-alert a {
    color: #ffb74d;
    text-decoration: underline;
  }

  .hint {
    margin: 16px auto 0;
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.45;
    text-align: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(18px);
    background: rgba(10, 18, 31, 0.94);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 0.92rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Collapsible sections */
  .section {
    margin-bottom: 14px;
  }

  .section summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 8px;
    cursor: pointer;
    list-style: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .section summary::-webkit-details-marker { display: none; }

  .section summary::before {
    content: '▸';
    font-size: 0.75rem;
    color: var(--muted);
    transition: transform 0.2s ease;
  }

  .section[open] summary::before {
    transform: rotate(90deg);
  }

  .section-title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Andata: blue accent */
  .section.andata .stop {
    border-left: 3px solid rgba(90,169,255,0.5);
  }
  .section.andata .live-line {
    background: rgba(90,169,255,0.18);
    border-color: rgba(90,169,255,0.25);
    color: #d7e9ff;
  }
  .section.andata .stop:hover {
    border-color: rgba(90,169,255,0.35);
    border-left-color: rgba(90,169,255,0.7);
  }
  .section.andata .section-title {
    color: #6bb5ff;
  }

  /* Ritorno: teal/green accent */
  .section.ritorno .stop {
    border-left: 3px solid rgba(77,205,180,0.5);
  }
  .section.ritorno .live-line {
    background: rgba(77,205,180,0.18);
    border-color: rgba(77,205,180,0.25);
    color: #c8f5ec;
  }
  .section.ritorno .stop:hover {
    border-color: rgba(77,205,180,0.35);
    border-left-color: rgba(77,205,180,0.7);
  }
  .section.ritorno .section-title {
    color: #5ee0c0;
  }

  /* Misc: amber accent */
  .section.misc .stop {
    border-left: 3px solid rgba(255,183,77,0.5);
  }
  .section.misc .live-line {
    background: rgba(255,183,77,0.18);
    border-color: rgba(255,183,77,0.25);
    color: #fff0d4;
  }
  .section.misc .stop:hover {
    border-color: rgba(255,183,77,0.35);
    border-left-color: rgba(255,183,77,0.7);
  }
  .section.misc .section-title {
    color: #ffb74d;
  }

  /* Mobile compact */
  @media (max-width: 759px) {
    .stop {
      padding: 8px 10px;
      border-radius: 16px;
    }

    .grid {
      gap: 8px;
    }

    .stop-name {
      font-size: 0.95rem;
    }

    .stop-code {
      margin-top: 2px;
      font-size: 0.78rem;
    }

    .stop-live {
      margin-top: 5px;
      gap: 4px;
    }

    .live-line {
      min-width: 34px;
      padding: 3px 6px;
      font-size: 0.68rem;
    }

    .live-times {
      font-size: 0.78rem;
    }

    .live-times strong {
      font-size: 0.88rem;
    }

    .live-row {
      gap: 6px;
    }

    .section {
      margin-bottom: 8px;
    }
  }

  @media (min-width: 760px) {
    body {
      padding: 28px 16px 40px;
    }

    .grid {
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="logo/icon-192.png" alt="Staffarda Bus" width="42" height="42">
        <div class="brand-copy">
          <h1>Staffarda Bus</h1>
          <p class="subtitle">Arrivi live per le fermate che usi davvero</p>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Aggiorna orari">↻</button>
    </header>

    <div class="status-row">
      <span></span>
      <span id="lastUpdate">Aggiornamento iniziale...</span>
    </div>

    <div id="sections"></div>

    <div class="hint">Nel dubbio non andare mai al Poli.</div>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    const API_BASE = "https://staffarda-bus-api.lorenzo-tegliucci.workers.dev";
    const PIRATE_API = "https://gpa.madbob.org/query.php";

    const sections = [
      {
        id: 'andata',
        label: 'Andata',
        stops: [
          { name: '15 Poli', code: '549', show: ['15'] },
          { name: '33 42 56 Poli', code: '877', show: ['33', '42', '56'] },
          { name: '16CS Valentino', code: '620', show: ['16 CS'] },
          { name: '16CD Scupet', code: '592', show: ['16 CD'] },
          { name: '55 Susa', code: '1514', show: ['55'] },
        ],
      },
      {
        id: 'ritorno',
        label: 'Ritorno',
        stops: [
          { name: 'Poli Casa', code: '617', show: ['15', '16 CD', '33', '42'] },
          { name: 'Susa Casa', sources: [
              { code: '2668', show: ['55'] },
              { code: '3350', show: ['56'] },
            ]},
          { name: 'Valentino Casa', code: '610', show: ['16 CD', '9'] },
        ],
      },
      {
        id: 'misc',
        label: 'Misc',
        stops: [
          { name: '15 Mongi', code: '548', show: ['15'] },
          { name: '33 42 56 Peschi', code: '2391', show: ['33', '42', '56'] },
          { name: '55 Robilant', code: '1515', show: ['55'] },
        ],
      },
    ];

    const sectionsEl = document.getElementById('sections');
    const toast = document.getElementById('toast');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdate = document.getElementById('lastUpdate');
    let toastTimer;
    let lineAlerts = {}; // { "15": [{title, link}], "33": [...] }

    // Collect all line numbers we care about
    function getAllLines() {
      const lines = new Set();
      for (const sec of sections) {
        for (const stop of sec.stops) {
          const shows = stop.sources ? stop.sources.flatMap(s => s.show) : stop.show;
          shows.forEach(l => lines.add(l));
        }
      }
      return lines;
    }

    // Fetch GTT alerts RSS and match against our lines
    async function fetchAlerts() {
      try {
        const rssUrl = 'https://www.gtt.to.it/cms/avvisi-e-informazioni-di-servizio?format=feed&type=rss';
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) return;
        const xml = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        const items = doc.querySelectorAll('item');
        const ourLines = getAllLines();
        const alerts = {};

        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '';
          // Match line numbers in title (e.g. "linea 15", "linee 33 – 42", just "15" near context)
          const titleUpper = title.toUpperCase();
          for (const line of ourLines) {
            // Match the line number as a word boundary
            const lineNum = line.replace(/\s+/g, '').toUpperCase();
            const patterns = [
              new RegExp(`\\b${lineNum}\\b`, 'i'),
              new RegExp(`\\b${line.replace(/\s+/g, '\\s*')}\\b`, 'i'),
            ];
            if (patterns.some(p => p.test(title))) {
              if (!alerts[line]) alerts[line] = [];
              // Avoid duplicates
              if (!alerts[line].some(a => a.link === link)) {
                alerts[line].push({ title, link });
              }
            }
          }
        });

        lineAlerts = alerts;
      } catch (e) {
        console.warn('Failed to fetch GTT alerts:', e);
      }
    }

    // Get alerts for a stop's lines
    function getStopAlerts(stop) {
      const shows = stop.sources ? stop.sources.flatMap(s => s.show) : stop.show;
      const found = [];
      for (const line of shows) {
        if (lineAlerts[line]) {
          for (const alert of lineAlerts[line]) {
            if (!found.some(f => f.link === alert.link)) {
              found.push(alert);
            }
          }
        }
      }
      return found;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function openStop(code, name) {
      showToast(`Apro ${name} · fermata ${code}`);
      const url = `https://www.gtt.to.it/cms/percorari/arrivi?palina=${encodeURIComponent(code)}`;
      window.open(url, '_blank');
    }

    function normalizeLine(value) {
      return String(value)
        .replace(/\s+/g, '')
        .replace(/-/g, '')
        .toUpperCase();
    }

    function setLastUpdate() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      lastUpdate.textContent = `Aggiornato alle ${hh}:${mm}`;
    }

    function timeToMinutes(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    // Transform Pirate API response: [{line, hour, realtime}] → grouped by line
    // Smart dedup: drop scheduled times only if a realtime entry is within 3 min (same bus)
    function transformPirateData(data) {
      const grouped = {};
      for (const entry of data) {
        const line = entry.line;
        if (!grouped[line]) grouped[line] = { line, times: [] };
        const hhmm = entry.hour.substring(0, 5);
        grouped[line].times.push({ time: hhmm, realtime: entry.realtime });
      }
      for (const key of Object.keys(grouped)) {
        const times = grouped[key].times;
        const rtTimes = times.filter(t => t.realtime);
        if (!rtTimes.length) continue;
        // Keep scheduled only if no realtime within 3 min
        const kept = times.filter(t => {
          if (t.realtime) return true;
          const tMin = timeToMinutes(t.time);
          return !rtTimes.some(r => Math.abs(timeToMinutes(r.time) - tMin) <= 3);
        });
        grouped[key].times = kept.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      }
      return Object.values(grouped);
    }

    // Transform our fallback API response: [{line, times: [str]}] → same format
    function transformFallbackData(data) {
      return data.map(item => ({
        line: item.line,
        times: item.times.map(t => ({ time: t, realtime: null }))
      }));
    }

    function formatLiveRows(stop, arrivals) {
      const wanted = stop.show.map(normalizeLine);

      const filtered = arrivals.filter(item => {
        const line = normalizeLine(item.line);
        return wanted.includes(line);
      });

      if (!filtered.length) {
        return '<span class="stop-live empty">Nessun orario trovato</span>';
      }

      const rows = filtered.map(item => {
        const slots = item.times.slice(0, 4);
        const parts = slots.map((s, i) => {
          const label = s.realtime ? s.time + '*' : s.time;
          return i === 0 ? `<strong>${label}</strong>` : label;
        });
        const timesHtml = `<span class="live-times">${parts.join(' • ')}</span>`;

        return `
          <div class="live-row">
            <span class="live-line">${item.line}</span>
            ${timesHtml}
          </div>
        `;
      }).join('');

      return `<div class="stop-live">${rows}</div>`;
    }

    async function fetchStop(code) {
      // Try Pirate API first (has realtime flag)
      try {
        const res = await fetch(`${PIRATE_API}?stop=${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        return transformPirateData(data);
      } catch (e) {
        console.warn(`Pirate API fallback for stop ${code}:`, e);
      }
      // Fallback to our API
      const res = await fetch(`${API_BASE}/?stop=${encodeURIComponent(code)}`);
      const data = await res.json();
      return transformFallbackData(data);
    }

    async function loadArrivals(stop, liveEl) {
      liveEl.className = 'stop-live loading';
      liveEl.textContent = 'Caricamento orari...';

      try {
        if (stop.sources) {
          const fetches = stop.sources.map(async (src) => {
            const arrivals = await fetchStop(src.code);
            const wanted = src.show.map(normalizeLine);
            return arrivals.filter(item => wanted.includes(normalizeLine(item.line)));
          });
          const results = await Promise.all(fetches);
          const allArrivals = results.flat();
          const allShow = stop.sources.flatMap(s => s.show);
          liveEl.outerHTML = formatLiveRows({ ...stop, show: allShow }, allArrivals);
        } else {
          const arrivals = await fetchStop(stop.code);
          liveEl.outerHTML = formatLiveRows(stop, arrivals);
        }
      } catch (error) {
        console.error('Errore arrivi:', error);
        liveEl.className = 'stop-live error';
        liveEl.textContent = 'Orari non disponibili';
      }
    }

    function buildCard(stop) {
      const button = document.createElement('button');
      const codes = stop.sources
        ? stop.sources.map(s => s.code)
        : [stop.code];
      const codeLabel = codes.map(c => `Fermata ${c}`).join(' · ');

      // Check for deviation alerts
      const alerts = getStopAlerts(stop);
      const alertHtml = alerts.length
        ? alerts.map(a =>
            `<div class="stop-alert">⚠ <a href="${a.link}" target="_blank" onclick="event.stopPropagation()">${a.title}</a></div>`
          ).join('')
        : '';

      button.className = 'stop';
      button.type = 'button';
      button.innerHTML = `
        <div class="stop-main">
          <span class="stop-name">${stop.name}</span>
          <span class="stop-code">${codeLabel}</span>
          ${alertHtml}
          <span class="stop-live loading">Caricamento orari...</span>
        </div>
        <div class="chevron">›</div>
      `;

      button.addEventListener('click', () => openStop(codes[0], stop.name));
      return button;
    }

    async function renderStops() {
      // Fetch alerts in parallel (non-blocking)
      await fetchAlerts();

      // Remember which sections are open
      const openState = {};
      sectionsEl.querySelectorAll('.section').forEach(det => {
        openState[det.dataset.id] = det.open;
      });

      sectionsEl.innerHTML = '';
      const allLoadTasks = [];

      for (const section of sections) {
        const details = document.createElement('details');
        details.className = `section ${section.id}`;
        details.dataset.id = section.id;
        // Default open, or preserve previous state
        details.open = openState[section.id] !== undefined ? openState[section.id] : true;

        const summary = document.createElement('summary');
        summary.innerHTML = `<span class="section-title">${section.label}</span>`;
        details.appendChild(summary);

        const grid = document.createElement('div');
        grid.className = 'grid';

        for (const stop of section.stops) {
          const card = buildCard(stop);
          grid.appendChild(card);
        }

        details.appendChild(grid);
        sectionsEl.appendChild(details);

        // Queue load tasks
        const liveEls = [...grid.querySelectorAll('.stop-live')];
        section.stops.forEach((stop, index) => {
          allLoadTasks.push(loadArrivals(stop, liveEls[index]));
        });
      }

      await Promise.all(allLoadTasks);
      setLastUpdate();
    }

    refreshBtn.addEventListener('click', async () => {
      showToast('Aggiorno gli orari');
      await renderStops();
    });

    renderStops();
  </script>
</body>
</html>
