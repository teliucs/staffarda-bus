<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Staffarda Bus</title>
<meta name="description" content="Arrivi live GTT per le fermate che usi davvero">
<link rel="icon" href="logo/favicon.ico" sizes="any">
<link rel="icon" href="logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Staffarda Bus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg: #0b1220;
    --bg-2: #0f1b33;
    --card: rgba(22, 34, 54, 0.88);
    --card-hover: rgba(27, 43, 68, 0.96);
    --text: #eef4ff;
    --muted: #98a8c3;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 14px 30px rgba(0,0,0,0.28);
    --accent: #5aa9ff;
    --accent-soft: rgba(90,169,255,0.16);
    --live: #d9e8ff;
    --error: #ffb4b4;
    --warn: #ffb74d;
    --warn-rgb: 255,183,77;
    --danger: #ff7a7a;
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, #17315d 0%, var(--bg) 38%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
    color: var(--text);
  }

  body {
    /* Lo sfondo sfumato copre sempre tutto lo schermo, anche con poco contenuto */
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(18px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
  }

  .app {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand img {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    flex: 0 0 auto;
  }

  .brand-copy {
    min-width: 0;
  }

  h1 {
    margin: 0;
    font-size: 1.9rem;
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .refresh-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border-radius: 14px;
    min-width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .refresh-btn:active {
    transform: scale(0.98);
  }

  .refresh-btn:disabled {
    cursor: default;
    opacity: 0.7;
  }

  .refresh-icon {
    display: inline-block;
  }

  .refresh-btn.is-loading .refresh-icon {
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 10px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 12px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(90,169,255,0.25);
  }

  .tab-count {
    min-width: 20px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(var(--warn-rgb), 0.18);
    color: var(--warn);
    font-size: 0.75rem;
    font-weight: 800;
    text-align: center;
  }

  .status-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .stop {
    position: relative;
    width: 100%;
    border: 1px solid var(--border);
    border-left: 3px solid rgba(var(--section-rgb), 0.5);
    background: linear-gradient(180deg, var(--card), rgba(18,29,47,0.95));
    color: var(--text);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: start;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .stop:hover {
    background: linear-gradient(180deg, var(--card-hover), rgba(21,37,60,0.98));
    border-color: rgba(var(--section-rgb), 0.35);
    border-left-color: rgba(var(--section-rgb), 0.7);
  }

  .stop:active {
    transform: scale(0.988);
  }

  .stop-main {
    min-width: 0;
    padding-top: 2px;
  }

  .stop-name {
    display: block;
    font-size: 1.06rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
    line-height: 1.15;
    text-decoration: none;
  }

  /* Il link del nome copre tutta la card, così resta cliccabile per intero */
  .stop-link::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }

  .stop-link:focus-visible {
    outline: none;
  }

  .stop-link:focus-visible::after {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .stop-code {
    display: block;
    margin-top: 4px;
    font-size: 0.86rem;
    color: var(--muted);
  }

  .stop-code-link {
    position: relative;
    z-index: 1;
    color: inherit;
    text-decoration: none;
  }

  .stop-code-link:hover {
    text-decoration: underline;
  }

  .stop-live {
    display: grid;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--live);
  }

  .live-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .live-line {
    flex: 0 0 54px;
    width: 54px;
    padding: 4px 0;
    border-radius: 10px;
    background: rgba(var(--section-rgb), 0.18);
    border: 1px solid rgba(var(--section-rgb), 0.25);
    color: var(--section-line-text);
    font-size: 0.72rem;
    font-weight: 800;
    text-align: center;
  }

  .row-alert-container {
    margin-left: auto;
    display: flex;
  }

  .live-times {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    color: var(--live);
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 0.82rem;
  }

  .time-slot {
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }

  .live-times strong {
    font-size: 0.95rem;
    color: #ffffff;
    font-weight: 800;
  }

  .live-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: #00e676;
    border-radius: 50%;
    margin-right: 3px;
    margin-bottom: 1px;
    vertical-align: middle;
    box-shadow: 0 0 6px rgba(0, 230, 118, 0.6);
    animation: pulse 1.8s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.7; }
  }

  .stop-live.loading,
  .stop-live.empty,
  .stop-live.error {
    display: block;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.05);
    font-size: 0.84rem;
    line-height: 1.35;
  }

  .stop-live.loading { color: var(--muted); }
  .stop-live.empty { color: var(--live); }
  .stop-live.error { color: var(--error); }

  .chevron {
    align-self: center;
    color: #7ea9d8;
    font-size: 1.2rem;
    padding-top: 2px;
  }

  .line-alert-badge {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(255,183,77,0.15);
    border: 1px solid rgba(255,183,77,0.3);
    color: #ffb74d;
    font-size: 0.8rem;
    text-decoration: none;
    margin: 0;
  }

  .line-alert-badge:hover {
    background: rgba(255,183,77,0.25);
  }

  .stop-live .line-alert-badge {
    cursor: pointer;
  }

  /* Vista deviazioni */
  .dev-list {
    display: grid;
    gap: 12px;
  }

  .dev-card {
    border: 1px solid var(--border);
    border-left: 3px solid rgba(var(--warn-rgb), 0.6);
    background: linear-gradient(180deg, var(--card), rgba(18,29,47,0.95));
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    scroll-margin-top: calc(12px + env(safe-area-inset-top));
    transition: box-shadow 0.4s ease;
  }

  .dev-card.is-focused {
    box-shadow: var(--shadow), 0 0 0 2px rgba(var(--warn-rgb), 0.6);
  }

  .dev-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .dev-line {
    flex: 0 0 auto;
    min-width: 54px;
    padding: 4px 8px;
    border-radius: 10px;
    background: rgba(var(--warn-rgb), 0.16);
    border: 1px solid rgba(var(--warn-rgb), 0.3);
    color: #fff0d4;
    font-size: 0.8rem;
    font-weight: 800;
    text-align: center;
  }

  .dev-head-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .dev-alert + .dev-alert,
  .dev-route {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .dev-alert-title {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--warn);
  }

  .dev-date {
    margin: 2px 0 0;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .dev-text {
    margin: 8px 0 0;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--live);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  .dev-route-dir {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dev-route-span {
    margin: 4px 0 0;
    font-size: 0.92rem;
    line-height: 1.4;
  }

  .dev-skipped {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
  }

  .dev-skipped li {
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,122,122,0.12);
    border: 1px solid rgba(255,122,122,0.25);
    color: #ffd0d0;
    font-size: 0.78rem;
  }

  .dev-note {
    margin: 8px 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .dev-map {
    height: 260px;
    margin-top: 12px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d1626;
  }

  .dev-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .dev-legend span::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 4px;
    margin-right: 6px;
    border-radius: 2px;
    vertical-align: middle;
    background: var(--swatch);
  }

  .dev-gtt-link {
    display: inline-block;
    margin-top: 12px;
    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
  }

  .dev-gtt-link:hover {
    text-decoration: underline;
  }

  .dev-empty,
  .dev-summary {
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }

  .dev-empty.error {
    color: var(--error);
  }

  /* Sfondo scuro finché le tiles non arrivano (Leaflet di default usa grigio chiaro) */
  .dev-map.leaflet-container {
    background: #0d1626;
    font: inherit;
  }

  .hint {
    margin: 16px auto 0;
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.45;
    text-align: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(18px);
    background: rgba(10, 18, 31, 0.94);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 0.92rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Collapsible sections */
  .section {
    margin-bottom: 14px;
  }

  .section summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 8px;
    cursor: pointer;
    list-style: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .section summary::-webkit-details-marker { display: none; }

  .section summary::before {
    content: '▸';
    font-size: 0.75rem;
    color: var(--muted);
    transition: transform 0.2s ease;
  }

  .section[open] summary::before {
    transform: rotate(90deg);
  }

  .section-title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--section-title);
  }

  /* Colori per sezione: andata blu, ritorno verde acqua, misc ambra */
  .section.andata {
    --section-rgb: 90,169,255;
    --section-title: #6bb5ff;
    --section-line-text: #d7e9ff;
  }

  .section.ritorno {
    --section-rgb: 77,205,180;
    --section-title: #5ee0c0;
    --section-line-text: #c8f5ec;
  }

  .section.misc {
    --section-rgb: 255,183,77;
    --section-title: #ffb74d;
    --section-line-text: #fff0d4;
  }

  /* Mobile compact */
  @media (max-width: 759px) {
    .stop {
      padding: 8px 10px;
      border-radius: 16px;
    }

    .grid {
      gap: 8px;
    }

    .stop-name {
      font-size: 0.95rem;
    }

    .stop-code {
      margin-top: 2px;
      font-size: 0.78rem;
    }

    .stop-live {
      margin-top: 5px;
      gap: 4px;
    }

    .live-line {
      padding: 3px 6px;
      font-size: 0.68rem;
    }

    .live-times {
      font-size: 0.78rem;
    }

    .live-times strong {
      font-size: 0.88rem;
    }

    .live-row {
      gap: 6px;
    }

    .section {
      margin-bottom: 8px;
    }
  }

  @media (min-width: 760px) {
    body {
      padding: 28px 16px 40px;
    }

    .grid {
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="logo/icon-96.png" alt="Staffarda Bus" width="42" height="42">
        <div class="brand-copy">
          <h1>Staffarda Bus</h1>
          <p class="subtitle">Arrivi live per le fermate che usi davvero</p>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Aggiorna orari"><span class="refresh-icon" aria-hidden="true">↻</span></button>
    </header>

    <nav class="tabs" aria-label="Sezioni">
      <a class="tab" href="#orari" data-view="orari">Orari</a>
      <a class="tab" href="#deviazioni" data-view="deviazioni">Deviazioni <span class="tab-count" id="devCount" hidden></span></a>
    </nav>

    <section id="viewOrari">
      <div class="status-row">
        <span id="lastUpdate">Aggiornamento iniziale...</span>
      </div>

      <div id="sections"></div>

      <div class="hint">Nel dubbio non andare mai al Poli.</div>
    </section>

    <section id="viewDeviazioni" hidden>
      <div class="status-row">
        <span id="devStatus"></span>
      </div>

      <div id="devList" class="dev-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    const API_BASE = "https://staffarda-bus-api.lorenzo-tegliucci.workers.dev";
    const PIRATE_API = "https://gpa.madbob.org/query.php";
    const GTT_STOP_URL = "https://www.gtt.to.it/cms/percorari/arrivi?palina=";
    const GTT_LINE_URL = "https://www.gtt.to.it/cms/percorari/urbano?view=percorsi&bacino=U&Regol=GE&linea=";
    const DEVIATIONS_API = "https://staffarda-bus-deviazioni.lorenzo-tegliucci.workers.dev";
    const LEAFLET_JS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    const LEAFLET_CSS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";

    const FETCH_TIMEOUT_MS = 5000;
    const AUTO_REFRESH_MS = 45 * 1000;
    const TICK_MS = 15 * 1000;
    const MAX_SLOTS = 4;
    const DEDUP_WINDOW_MS = 3 * 60 * 1000;
    // Un passaggio resta visibile fino a 1 minuto dopo l'orario previsto
    const DEPARTED_GRACE_MS = 60 * 1000;
    // Il Worker deve scaricare la pagina della linea da GTT: serve più tempo
    const DEVIATIONS_TIMEOUT_MS = 15 * 1000;
    const DEVIATIONS_MAX_AGE_MS = 5 * 60 * 1000;
    const DATA_CACHE_KEY = 'staffarda-bus:last-data';
    // Oltre questa età i dati salvati non servono più: i bus sono già passati
    const DATA_CACHE_MAX_AGE_MS = 2 * 60 * 60 * 1000;

    // Una fermata può avere un solo `code` + `show`, oppure più `sources`
    // (fermata "logica" composta da più paline)
    const config = [
      {
        id: 'andata',
        label: 'Andata',
        stops: [
          { name: '15 Poli', code: '549', show: ['15'] },
          { name: '33 42 56 Poli', code: '877', show: ['33', '42', '56'] },
          { name: '16CS Valentino', code: '620', show: ['16 CS'] },
          { name: '16CD Scupet', code: '592', show: ['16 CD'] },
          { name: '55 Susa', code: '1514', show: ['55'] },
        ],
      },
      {
        id: 'ritorno',
        label: 'Ritorno',
        stops: [
          { name: 'Poli Casa', code: '617', show: ['15', '16 CD', '33', '42'] },
          { name: 'Panche Casa', sources: [
              { code: '207', show: ['16 CD'] },
              { code: '640', show: ['16 CS'] },
              { code: '2081', show: ['68'] },
              { code: '475', show: ['15'] }
            ]},
          { name: 'Susa Casa', sources: [
              { code: '2668', show: ['55'] },
              { code: '3350', show: ['56'] },
            ]},
          { name: 'Valentino Casa', code: '610', show: ['16 CD', '9'] },
          { name: 'Vittorio Veneto', sources: [
              { code: '563', show: ['15'] },
              { code: '604', show: ['16 CD'] },
              { code: '478', show: ['55'] },
              { code: '479', show: ['56'] }
            ]},
        ],
      },
      {
        id: 'misc',
        label: 'Misc',
        stops: [
          { name: '15 Mongi', code: '548', show: ['15'] },
          { name: '33 42 56 Peschi', code: '2391', show: ['33', '42', '56'] },
          { name: '55 56 Robilant', code: '1515', show: ['55', '56'] },
        ],
      },
    ];

    // Forma unica: ogni fermata diventa { name, sources: [{ code, show }] }
    const sections = config.map(section => ({
      ...section,
      stops: section.stops.map(stop => ({
        name: stop.name,
        sources: stop.sources || [{ code: stop.code, show: stop.show }],
      })),
    }));
    const allStops = sections.flatMap(section => section.stops);
    const allCodes = [...new Set(allStops.flatMap(stop => stop.sources.map(src => src.code)))];

    const sectionsEl = document.getElementById('sections');
    const toast = document.getElementById('toast');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdate = document.getElementById('lastUpdate');
    const viewOrari = document.getElementById('viewOrari');
    const viewDeviazioni = document.getElementById('viewDeviazioni');
    const devList = document.getElementById('devList');
    const devStatus = document.getElementById('devStatus');
    const devCount = document.getElementById('devCount');

    // stop -> { status: 'loading' | 'ready' | 'error', rows: [{ line, times: [{ ts, realtime }] }] }
    const stopState = new Map();
    const liveEls = new Map(); // stop -> elemento .stop-live
    let lineAlerts = {}; // { "15": [{title, link}], "33": [...] }
    let toastTimer;
    let refreshing = false;
    let lastRefresh = 0;
    let deviationsLoadedAt = 0;
    let deviationsLoading = null;
    let deviationMaps = [];
    let leafletPromise = null;
    let dataSavedAt = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function externalLink(className, href, text) {
      const link = el('a', className, text);
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
      return link;
    }

    function stopUrl(code) {
      return GTT_STOP_URL + encodeURIComponent(code);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function normalizeLine(value) {
      return String(value)
        .replace(/\s+/g, '')
        .replace(/-/g, '')
        .toUpperCase();
    }

    // "HH:MM" → timestamp, scegliendo il giorno più vicino ad adesso:
    // alle 23:50 un "00:03" è domani, alle 00:05 un "23:58" è ieri.
    function clockToTimestamp(value, now) {
      const match = /(\d{1,2}):(\d{2})/.exec(String(value));
      if (!match) return null;
      const date = new Date(now);
      date.setHours(Number(match[1]), Number(match[2]), 0, 0);
      const diff = date.getTime() - now;
      const halfDay = 12 * 60 * 60 * 1000;
      if (diff < -halfDay) date.setDate(date.getDate() + 1);
      else if (diff > halfDay) date.setDate(date.getDate() - 1);
      return date.getTime();
    }

    function formatClock(ts) {
      const date = new Date(ts);
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function sortByTime(times) {
      return times.sort((a, b) => a.ts - b.ts);
    }

    // Transform Pirate API response: [{line, hour, realtime}] → grouped by line
    // Smart dedup: drop scheduled times only if a realtime entry is within 3 min (same bus)
    function transformPirateData(data) {
      const now = Date.now();
      const grouped = new Map();
      for (const entry of data) {
        const ts = clockToTimestamp(entry.hour, now);
        if (ts == null) continue;
        if (!grouped.has(entry.line)) grouped.set(entry.line, []);
        grouped.get(entry.line).push({ ts, realtime: Boolean(entry.realtime) });
      }
      return [...grouped].map(([line, times]) => {
        const rtTimes = times.filter(t => t.realtime);
        const kept = times.filter(t =>
          t.realtime || !rtTimes.some(r => Math.abs(r.ts - t.ts) <= DEDUP_WINDOW_MS));
        return { line, times: sortByTime(kept) };
      });
    }

    // Transform our fallback API response: [{line, times: [str]}] → same format
    function transformFallbackData(data) {
      const now = Date.now();
      return data.map(item => ({
        line: item.line,
        times: sortByTime((item.times || [])
          .map(t => ({ ts: clockToTimestamp(t, now), realtime: false }))
          .filter(t => t.ts != null)),
      }));
    }

    async function fetchJson(url, timeoutMs = FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Una sola richiesta al Worker per palina a ogni aggiornamento,
    // condivisa tra il fallback degli orari e gli avvisi.
    function createWorkerClient() {
      const cache = new Map();
      return code => {
        if (!cache.has(code)) {
          cache.set(code, fetchJson(`${API_BASE}/?stop=${encodeURIComponent(code)}`));
        }
        return cache.get(code);
      };
    }

    async function fetchArrivals(code, worker) {
      try {
        return transformPirateData(await fetchJson(`${PIRATE_API}?stop=${encodeURIComponent(code)}`));
      } catch (e) {
        return transformFallbackData(await worker(code));
      }
    }

    // Alerts come from our worker API (which scrapes the GTT palina pages directly).
    // This catches local/temporary deviations that the general RSS feed misses.
    async function fetchAlerts(worker) {
      const alerts = {};
      await Promise.all(allCodes.map(async code => {
        let data;
        try {
          data = await worker(code);
        } catch (e) {
          return;
        }
        for (const item of data) {
          const match = /^([A-Z0-9+]+)\s+(deviat.*)$/i.exec(String(item.line));
          if (!match) continue;
          const lineKey = normalizeLine(match[1]);
          const title = `Linea ${match[1]} ${match[2].trim()}`;
          if (!alerts[lineKey]) alerts[lineKey] = [];
          if (!alerts[lineKey].some(a => a.title === title)) {
            alerts[lineKey].push({ title, link: stopUrl(code) });
          }
        }
      }));
      return alerts;
    }

    // Returns false if the stop could not be updated
    async function loadStop(stop, worker) {
      let ok = true;
      try {
        const results = await Promise.all(stop.sources.map(async src => {
          const wanted = src.show.map(normalizeLine);
          const arrivals = await fetchArrivals(src.code, worker);
          return arrivals.filter(item => wanted.includes(normalizeLine(item.line)));
        }));
        stopState.set(stop, { status: 'ready', rows: results.flat() });
      } catch (e) {
        ok = false;
        // Se avevamo già dei dati li teniamo invece di mostrare l'errore
        if (stopState.get(stop)?.status !== 'ready') {
          stopState.set(stop, { status: 'error', rows: [] });
        }
      }
      renderLive(stop, Date.now());
      return ok;
    }

    // Il badge apre la linea nella vista Deviazioni
    function buildAlertBadge(alert, lineKey) {
      const badge = el('a', 'line-alert-badge', '⚠');
      badge.href = `#deviazioni-${lineKey}`;
      badge.title = alert.title;
      badge.setAttribute('aria-label', alert.title);
      return badge;
    }

    function buildLiveRow(row) {
      const rowEl = el('div', 'live-row');
      rowEl.append(el('span', 'live-line', row.line));

      const timesEl = el('div', 'live-times');
      row.times.slice(0, MAX_SLOTS).forEach((t, i) => {
        const slot = el('span', 'time-slot');
        slot.title = t.realtime ? 'Live' : 'Programmato';
        const label = el(i === 0 ? 'strong' : 'span');
        // Limit the realtime indicator to only the first 2 upcoming buses per line.
        if (t.realtime && i < 2) label.append(el('span', 'live-dot'));
        label.append(formatClock(t.ts));
        slot.append(label);
        timesEl.append(slot);
      });
      rowEl.append(timesEl);

      const alertSlot = el('span', 'row-alert-container');
      const lineKey = normalizeLine(row.line);
      const alert = lineAlerts[lineKey]?.[0];
      if (alert) alertSlot.append(buildAlertBadge(alert, lineKey));
      rowEl.append(alertSlot);

      return rowEl;
    }

    function setLiveMessage(container, kind, text) {
      container.className = `stop-live ${kind}`;
      container.textContent = text;
    }

    function renderLive(stop, now) {
      const container = liveEls.get(stop);
      const state = stopState.get(stop);
      if (!state || state.status === 'loading') {
        return setLiveMessage(container, 'loading', 'Caricamento orari...');
      }
      if (state.status === 'error') {
        return setLiveMessage(container, 'error', 'Orari non disponibili');
      }

      const rows = state.rows
        .map(row => ({ line: row.line, times: row.times.filter(t => t.ts - now >= -DEPARTED_GRACE_MS) }))
        .filter(row => row.times.length);
      if (!rows.length) {
        return setLiveMessage(container, 'empty', 'Nessun orario trovato');
      }

      container.className = 'stop-live';
      container.replaceChildren(...rows.map(buildLiveRow));
    }

    function renderAll() {
      const now = Date.now();
      allStops.forEach(stop => renderLive(stop, now));
      updateDeviationCount();
    }

    function buildCard(stop) {
      const card = el('article', 'stop');
      const main = el('div', 'stop-main');

      main.append(externalLink('stop-name stop-link', stopUrl(stop.sources[0].code), stop.name));

      // Con più paline ogni codice ha il suo link
      const codesEl = el('span', 'stop-code');
      stop.sources.forEach((src, i) => {
        if (i > 0) codesEl.append(' · ');
        const label = `Fermata ${src.code}`;
        codesEl.append(stop.sources.length > 1
          ? externalLink('stop-code-link', stopUrl(src.code), label)
          : label);
      });
      main.append(codesEl);

      const live = el('div');
      liveEls.set(stop, live);
      main.append(live);
      renderLive(stop, Date.now());

      const chevron = el('div', 'chevron', '›');
      chevron.setAttribute('aria-hidden', 'true');

      card.append(main, chevron);
      return card;
    }

    function buildSections() {
      for (const section of sections) {
        const details = el('details', `section ${section.id}`);
        details.open = true;

        const summary = el('summary');
        summary.append(el('span', 'section-title', section.label));

        const grid = el('div', 'grid');
        section.stops.forEach(stop => grid.append(buildCard(stop)));

        details.append(summary, grid);
        sectionsEl.append(details);
      }
    }

    function setLastUpdate(failedCount) {
      if (failedCount === allStops.length) {
        lastUpdate.textContent = dataSavedAt
          ? `Offline · dati delle ${formatClock(dataSavedAt)}`
          : 'Offline · orari non disponibili';
        return;
      }
      const suffix = failedCount ? ' · alcune fermate non aggiornate' : '';
      lastUpdate.textContent = `Aggiornato alle ${formatClock(Date.now())}${suffix}`;
    }

    // Ultimi dati scaricati, per mostrare subito qualcosa all'apertura
    // (anche offline) mentre arrivano quelli nuovi.
    function saveDataCache() {
      const stops = {};
      for (const stop of allStops) {
        const state = stopState.get(stop);
        if (state?.status === 'ready') stops[stop.name] = state.rows;
      }
      dataSavedAt = Date.now();
      try {
        localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ savedAt: dataSavedAt, stops, alerts: lineAlerts }));
      } catch (e) {}
    }

    function restoreDataCache() {
      let data;
      try {
        data = JSON.parse(localStorage.getItem(DATA_CACHE_KEY));
      } catch (e) {
        return;
      }
      if (!data || Date.now() - data.savedAt > DATA_CACHE_MAX_AGE_MS) return;
      for (const stop of allStops) {
        const rows = data.stops?.[stop.name];
        if (rows) stopState.set(stop, { status: 'ready', rows });
      }
      lineAlerts = data.alerts || {};
      updateDeviationCount();
      dataSavedAt = data.savedAt;
      lastUpdate.textContent = `Dati delle ${formatClock(dataSavedAt)} · aggiornamento...`;
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      refreshBtn.disabled = true;
      refreshBtn.classList.add('is-loading');

      try {
        const worker = createWorkerClient();
        const alertsTask = fetchAlerts(worker).then(alerts => {
          lineAlerts = alerts;
          renderAll();
        });
        const results = await Promise.all(allStops.map(stop => loadStop(stop, worker)));
        await alertsTask;
        const failedCount = results.filter(ok => !ok).length;
        if (failedCount < allStops.length) saveDataCache();
        setLastUpdate(failedCount);
      } finally {
        lastRefresh = Date.now();
        refreshing = false;
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('is-loading');
      }
    }

    // --- Vista deviazioni ----------------------------------------------------

    // Linee da controllare: tutte quelle mostrate nelle card, una volta sola
    const allLines = [...new Map(allStops
      .flatMap(stop => stop.sources.flatMap(src => src.show))
      .map(label => [normalizeLine(label), { key: normalizeLine(label), label }])).values()];

    function updateDeviationCount() {
      const count = allLines.filter(line => lineAlerts[line.key]?.length).length;
      devCount.hidden = !count;
      devCount.textContent = count;
    }

    function loadLeaflet() {
      if (!leafletPromise) {
        leafletPromise = new Promise((resolve, reject) => {
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = LEAFLET_CSS;
          document.head.append(css);
          const script = document.createElement('script');
          script.src = LEAFLET_JS;
          script.onload = () => resolve(window.L);
          script.onerror = () => {
            leafletPromise = null;
            reject(new Error('Leaflet non caricato'));
          };
          document.head.append(script);
        });
      }
      return leafletPromise;
    }

    function loadDeviations() {
      if (!deviationsLoading) {
        deviationsLoading = (async () => {
          if (!deviationsLoadedAt) {
            devStatus.textContent = 'Controllo le tue linee...';
            devList.replaceChildren(el('div', 'dev-empty', 'Caricamento deviazioni...'));
          }
          const results = await Promise.all(allLines.map(async line => {
            try {
              const data = await fetchJson(`${DEVIATIONS_API}/deviazioni?linea=${encodeURIComponent(line.key)}`, DEVIATIONS_TIMEOUT_MS);
              return { ...line, data };
            } catch (e) {
              return { ...line, error: true };
            }
          }));
          deviationsLoadedAt = Date.now();
          await renderDeviations(results);
        })().finally(() => {
          deviationsLoading = null;
        });
      }
      return deviationsLoading;
    }

    function buildDeviationRoute(line, deviation) {
      const block = el('div', 'dev-route');
      if (deviation.direction) block.append(el('p', 'dev-route-dir', `Direzione ${deviation.direction}`));

      const span = el('p', 'dev-route-span');
      span.append('Deviata tra ', el('strong', null, deviation.from.name), ' e ', el('strong', null, deviation.to.name));
      block.append(span);

      if (deviation.skipped === null) {
        block.append(el('p', 'dev-note', 'Fermate saltate non disponibili.'));
      } else if (!deviation.skipped.length) {
        block.append(el('p', 'dev-note', 'Nessuna fermata saltata.'));
      } else {
        block.append(el('p', 'dev-note', `Fermate non servite (${deviation.skipped.length}):`));
        const list = el('ul', 'dev-skipped');
        deviation.skipped.forEach(stop => list.append(el('li', null, `${stop.name} · ${stop.id}`)));
        block.append(list);
      }

      if (deviation.paths.length) {
        const map = el('div', 'dev-map');
        const legend = el('div', 'dev-legend');
        [['Percorso normale', '#7f8ea8'], ['Tratto non percorso', 'var(--danger)'], ['Inizio e fine deviazione', '#5ee0c0']]
          .forEach(([label, color]) => {
            const item = el('span', null, label);
            item.style.setProperty('--swatch', color);
            legend.append(item);
          });
        block.append(map, legend);
        const route = line.data.routes.find(r => r.id === deviation.route);
        block.mapTask = () => drawDeviationMap(map, route, deviation);
      }
      return block;
    }

    async function drawDeviationMap(container, route, deviation) {
      let L;
      try {
        L = await loadLeaflet();
      } catch (e) {
        container.replaceWith(el('p', 'dev-note', 'Mappa non disponibile.'));
        return;
      }
      const map = L.map(container, {
        scrollWheelZoom: false,
        dragging: !L.Browser.mobile,
        attributionControl: true,
      });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO',
      }).addTo(map);

      if (route?.path.length) {
        L.polyline(route.path, { color: '#7f8ea8', weight: 4, opacity: 0.55 }).addTo(map);
      }
      // GTT pubblica il tratto del percorso normale che non viene fatto,
      // non il percorso alternativo (quello è solo nel testo dell'avviso)
      const skippedStretch = L.polyline(deviation.paths, { color: '#ff7a7a', weight: 5, opacity: 0.95, dashArray: '8 6' }).addTo(map);

      const bounds = skippedStretch.getBounds();
      for (const stop of deviation.skipped || []) {
        L.circleMarker([stop.lat, stop.lng], { radius: 5, color: '#ff7a7a', weight: 2, fillColor: '#ff7a7a', fillOpacity: 0.6 })
          .bindTooltip(`Saltata: ${stop.name} · ${stop.id}`)
          .addTo(map);
        bounds.extend([stop.lat, stop.lng]);
      }
      const ends = [[deviation.from, 'Inizio deviazione'], [deviation.to, 'Fine deviazione']];
      for (const [end, label] of ends) {
        const stop = route?.stops.find(s => s.id === end.id);
        if (!stop) continue;
        L.circleMarker([stop.lat, stop.lng], { radius: 7, color: '#5ee0c0', weight: 3, fillColor: '#0b1220', fillOpacity: 1 })
          .bindTooltip(`${label}: ${stop.name} · ${stop.id}`)
          .addTo(map);
        bounds.extend([stop.lat, stop.lng]);
      }
      map.fitBounds(bounds, { padding: [20, 20] });
      map.detourBounds = bounds;
      deviationMaps.push(map);
    }

    function buildDeviationCard(line) {
      const { alerts, deviations } = line.data;
      const card = el('article', 'dev-card');
      card.id = `dev-${line.key}`;

      const head = el('div', 'dev-head');
      head.append(el('span', 'dev-line', line.label));
      head.append(el('h2', 'dev-head-title', deviations.length ? 'Linea deviata' : 'Avvisi sulla linea'));
      card.append(head);

      for (const alert of alerts) {
        const block = el('div', 'dev-alert');
        block.append(el('h3', 'dev-alert-title', alert.title));
        if (alert.date) block.append(el('p', 'dev-date', `Pubblicato il ${alert.date}`));
        if (alert.text) block.append(el('p', 'dev-text', alert.text));
        card.append(block);
      }

      const mapTasks = [];
      for (const deviation of deviations) {
        const block = buildDeviationRoute(line, deviation);
        if (block.mapTask) mapTasks.push(block.mapTask);
        card.append(block);
      }

      card.append(externalLink('dev-gtt-link', GTT_LINE_URL + encodeURIComponent(line.key), 'Apri la linea su GTT ›'));
      card.mapTasks = mapTasks;
      return card;
    }

    async function renderDeviations(results) {
      deviationMaps.forEach(map => map.remove());
      deviationMaps = [];

      // Prima le linee con un tratto deviato, poi quelle con soli avvisi
      const withNews = results
        .filter(line => line.data && (line.data.alerts.length || line.data.deviations.length))
        .sort((a, b) => Number(Boolean(b.data.deviations.length)) - Number(Boolean(a.data.deviations.length)));
      const quiet = results.filter(line => line.data && !withNews.includes(line));
      const failed = results.filter(line => line.error);

      const nodes = withNews.map(buildDeviationCard);
      if (!withNews.length && !failed.length) {
        nodes.push(el('div', 'dev-empty', 'Nessuna deviazione o avviso sulle tue linee.'));
      }
      if (quiet.length) {
        nodes.push(el('div', 'dev-summary', `Nessun avviso: ${quiet.map(line => line.label).join(' · ')}`));
      }
      if (failed.length) {
        nodes.push(el('div', 'dev-empty error', `Non disponibili: ${failed.map(line => line.label).join(' · ')}`));
      }
      devList.replaceChildren(...nodes);

      devStatus.textContent = failed.length === results.length
        ? 'Deviazioni non disponibili'
        : `Aggiornato alle ${formatClock(deviationsLoadedAt)}`;

      // Le mappe vanno disegnate a contenitore visibile, altrimenti Leaflet sbaglia le misure
      await Promise.all(nodes.flatMap(node => node.mapTasks || []).map(task => task()));
    }

    function focusDeviation(lineKey) {
      if (!lineKey) return;
      const card = document.getElementById(`dev-${lineKey}`);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.classList.add('is-focused');
      setTimeout(() => card.classList.remove('is-focused'), 1600);
    }

    async function openDeviations(lineKey) {
      if (Date.now() - deviationsLoadedAt > DEVIATIONS_MAX_AGE_MS) {
        await loadDeviations();
      } else {
        deviationMaps.forEach(map => {
          map.invalidateSize();
          map.fitBounds(map.detourBounds, { padding: [20, 20] });
        });
      }
      focusDeviation(lineKey);
    }

    function currentView() {
      return location.hash.startsWith('#deviazioni') ? 'deviazioni' : 'orari';
    }

    // #orari, #deviazioni oppure #deviazioni-15 (apre e scorre fino alla linea)
    function showView() {
      const view = currentView();
      viewOrari.hidden = view !== 'orari';
      viewDeviazioni.hidden = view !== 'deviazioni';
      document.querySelectorAll('.tab').forEach(tab => {
        if (tab.dataset.view === view) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      });
      if (view === 'deviazioni') {
        window.scrollTo(0, 0);
        openDeviations(location.hash.slice('#deviazioni-'.length) || null);
      }
    }

    // Nasconde in locale i passaggi già avvenuti e ricarica i dati
    // solo se la pagina è visibile e sono vecchi.
    function tick() {
      renderAll();
      if (document.visibilityState === 'visible' && Date.now() - lastRefresh >= AUTO_REFRESH_MS) {
        refresh();
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentView() === 'deviazioni') {
        showToast('Aggiorno le deviazioni');
        loadDeviations();
        return;
      }
      showToast('Aggiorno gli orari');
      refresh();
    });

    window.addEventListener('hashchange', showView);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') tick();
    });

    restoreDataCache();
    buildSections();
    showView();
    refresh();
    setInterval(tick, TICK_MS);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker non registrato:', e));
    }
  </script>
</body>
</html>
